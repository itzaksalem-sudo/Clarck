name: Build Android app
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Publish APK in the repo
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Clark.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add Clark.apk
          git commit -m "Build Android app" || exit 0
          git pull --rebase origin main
          git push origin main
