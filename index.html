<style>

/* world */
#st{position:absolute;inset:0;background-size:100% 100%;transform-origin:0 0}
#me{position:absolute;width:calc(var(--h,600px)*0.1111*var(--s,1)*var(--wf,1));height:calc(var(--h,600px)*0.17274*var(--s,1));transform:translate(-50%,-100%);pointer-events:none}
#me::before{content:"";position:absolute;left:calc(50% - 40%/var(--wf,1));right:calc(50% - 40%/var(--wf,1));bottom:-3%;height:9%;border-radius:50%;background:#0006;filter:blur(2px)}

:is(#bub,.pbub){position:absolute;left:50%;top:0;transform:translate(-50%,-100%);font-size:calc(var(--h,600px)*.0225);width:calc(var(--bw,8)*1em);height:calc(var(--bh,3.8)*1em);z-index:1500;display:none;pointer-events:none}

:is(#bub,.pbub) .blk{display:flex;flex-direction:column;width:max-content;max-width:100%}:is(#bub,.pbub) .emo{display:flex;gap:2px;align-items:center}:is(#bub,.pbub) .emo.big img{height:1.7em}

/* v53 walk: the whole body hops with every step (squash on landing, stretch in the air, small lean/sway); where both legs can be told apart they are lifted one after the other */
.fl .spr{position:relative}
.fl .lg{position:absolute;inset:0;display:none;pointer-events:none;background:var(--bg) 0 0/100% 100% no-repeat;transform-origin:50% 100%}

.walk .fl.lgs .lg,.fl.lgs.walk .lg{display:block}

@keyframes wk53a{0%{translate:0 0}25%{translate:0 calc(var(--L,0)*-100%)}50%,100%{translate:0 0}}

@media (hover:hover){#hm .tbn button:hover{animation:none;transform:translateY(-.15cqw) scale(1.06);filter:brightness(1.1) drop-shadow(0 .6cqw .9cqw rgba(10,30,90,.5))}}
#hm .tbn button:active{animation:none;transform:scale(.94)}
#hm .tbn button:focus-visible,#hgo:focus-visible{outline:.35cqw solid #fff;outline-offset:.3cqw;border-radius:2cqw}
#hm .tbn button.nw::before{content:"!";position:absolute;right:-.4cqw;top:-.7cqw;z-index:2;min-width:2.3cqw;height:2.3cqw;border-radius:50%;background:#ff4d4d;color:#fff;font-weight:800;font-size:1.6cqw;display:flex;align-items:center;justify-content:center;box-shadow:0 .2cqw .4cqw rgba(0,0,0,.4);animation:hpl 1.4s ease-in-out infinite}
@keyframes hpl{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
#hgo{position:absolute;left:50%;bottom:3.4cqw;width:10.4cqw;margin-left:-5.2cqw;border:0;padding:0;background:none;cursor:pointer;z-index:4;animation:hup .9s cubic-bezier(.3,1.5,.5,1) .5s both;transition:transform .18s cubic-bezier(.3,1.7,.5,1)}
@keyframes hup{from{opacity:0;transform:translateY(8cqw) scale(.6)}to{opacity:1;transform:none}}
#hgo .halo{position:absolute;left:-18%;top:-18%;width:136%;height:136%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,226,90,.85) 0,rgba(255,200,40,.45) 38%,rgba(255,200,40,0) 68%);animation:hhalo 2s ease-in-out infinite}
@keyframes hhalo{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
#hgo .ring{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;border-radius:50%;border:.35cqw solid rgba(255,235,120,.9);pointer-events:none;animation:hring 2.4s ease-out infinite}
#hgo .ring.r2{animation-delay:1.2s}
@keyframes hring{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.9);opacity:0}}
#hgo .coin{position:relative;display:block;width:100%;aspect-ratio:1261/1247;-webkit-user-drag:none;pointer-events:none;filter:drop-shadow(0 .6cqw .8cqw rgba(60,30,0,.5));animation:hbob 2.2s ease-in-out infinite}
@keyframes hbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-1cqw) rotate(3deg)}}
#hgo .lbl{position:absolute;left:50%;bottom:-2.1cqw;transform:translateX(-50%);white-space:nowrap;padding:.15cqw 1.7cqw .35cqw;border-radius:99px;font-weight:800;font-size:2.15cqw;line-height:1.2;color:#fff;background:linear-gradient(#7a54ff,#4a2fd8);border:.28cqw solid #fff;text-shadow:0 .15cqw 0 #2a1a99;box-shadow:0 .4cqw .8cqw rgba(30,10,100,.5)}
@media (hover:hover){#hgo:hover{transform:scale(1.12)}}
#hgo.rdy{animation:none}
#hgo:active{transform:scale(.93)}
#hm .ver{position:absolute;left:2cqw;bottom:1.2cqw;font-size:1.2cqw;font-weight:700;color:#fff;text-shadow:0 .1cqw .3cqw rgba(0,0,40,.7);opacity:.85;z-index:2}
/* panels */
.pov{position:absolute;inset:0;z-index:6;display:none;align-items:flex-start;justify-content:center;background:rgba(10,20,70,.5);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}
.pov.on{display:flex;animation:hsin .25s ease both}
.pcard{position:relative;margin-top:11cqw;width:min(72cqw,1500px);max-height:36cqw;display:flex;flex-direction:column;border-radius:2.6cqw;background:linear-gradient(#f6faff,#d9e8ff);border:.5cqw solid #fff;box-shadow:0 0 0 .5cqw #3a5df0,0 1.4cqw 3cqw rgba(0,10,80,.6);animation:hpop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes hpop{from{transform:scale(.6) translateY(4cqw);opacity:0}to{transform:none;opacity:1}}
.pcard .phd{position:absolute;left:50%;top:-5.6cqw;width:21cqw;margin-left:-10.5cqw;pointer-events:none;filter:drop-shadow(0 .4cqw .6cqw rgba(10,30,90,.45))}
.pcard .px{position:absolute;left:-1.4cqw;top:-1.6cqw;width:4.2cqw;height:4.2cqw;border-radius:50%;border:.3cqw solid #fff;background:linear-gradient(#ff7a6b,#e8362a);box-shadow:0 .3cqw .6cqw rgba(0,0,0,.45);cursor:pointer;padding:0;z-index:2;transition:transform .18s cubic-bezier(.3,1.7,.5,1)}
.pcard .px::before,.pcard .px::after{content:"";position:absolute;left:50%;top:50%;width:2cqw;height:.42cqw;margin:-.21cqw 0 0 -1cqw;border-radius:9px;background:#fff;transform:rotate(45deg)}
.pcard .px::after{transform:rotate(-45deg)}
@media (hover:hover){.pcard .px:hover{transform:scale(1.12) rotate(8deg)}}
.pcard .pbd{overflow:auto;padding:5.2cqw 3cqw 2.4cqw;font-size:max(13px,1.55cqw);line-height:1.5;color:#14246a;font-weight:600;text-align:right;-webkit-overflow-scrolling:touch}
.pbd h3{margin:.2em 0 .25em;font-size:1.25em;font-weight:800;color:#2a3fd0}
.pbd ul{margin:.2em 0 .6em;padding:0 1.2em 0 0}.pbd li{margin:.2em 0}
.pbd .tag{display:inline-block;margin-left:.5em;padding:0 .6em;border-radius:99px;background:#3a5df0;color:#fff;font-size:.8em;font-weight:800}
.pbd .btns{display:flex;gap:1.2cqw;flex-wrap:wrap;margin:.6em 0}
.pbd .big{display:inline-block;padding:.35em 1.3em;border-radius:99px;border:.25cqw solid #fff;font:inherit;font-weight:800;color:#fff;text-decoration:none;cursor:pointer;background:linear-gradient(#59d466,#2da63b);text-shadow:0 .1cqw 0 #1b6a24;box-shadow:0 .3cqw .6cqw rgba(0,40,0,.35)}
.pbd .big.off{background:linear-gradient(#b9c3dd,#8f9bbb);text-shadow:none;cursor:default}
.pbd .note{margin-top:.5em;padding:.5em .9em;border-radius:1.2cqw;background:#fff6d6;border:.2cqw solid #f1c24a;color:#6b4b00}
/* update */
#up .box{position:absolute;left:50%;top:20.5cqw;width:46cqw;margin-left:-23cqw;text-align:center;z-index:3}
#up .pct{font-size:7.2cqw;font-weight:800;line-height:1;color:#fff;letter-spacing:.02em;-webkit-text-stroke:.35cqw #1d4cd8;paint-order:stroke fill;text-shadow:0 .5cqw 0 #1639a8,0 1cqw 1.4cqw rgba(0,20,120,.45)}
#up .trk{position:relative;margin-top:1.6cqw;height:4.2cqw;border-radius:99px;background:rgba(255,255,255,.55);border:.45cqw solid #fff;box-shadow:0 0 0 .4cqw #2f55e8,0 .6cqw 1.2cqw rgba(0,20,100,.4),inset 0 .3cqw .6cqw rgba(20,40,160,.35);overflow:visible}
#up .fil{position:absolute;left:0;top:0;bottom:0;width:1%;direction:ltr;border-radius:99px;background:linear-gradient(#5ee0ff,#2a8bff 55%,#6a4cff);overflow:hidden;transition:none}
#up .fil::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 1.4cqw,rgba(255,255,255,0) 1.4cqw 2.8cqw);animation:hstr 1s linear infinite}
@keyframes hstr{from{background-position:0 0}to{background-position:-3.2cqw 0}}
#up .fil::after{content:"";position:absolute;left:0;right:0;top:6%;height:38%;border-radius:99px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0))}
#up .knob{position:absolute;top:50%;left:1%;width:5.2cqw;height:5.2cqw;margin:-2.6cqw 0 0 -2.6cqw;pointer-events:none;background:radial-gradient(circle,#fff 0 22%,rgba(255,238,140,.95) 36%,rgba(255,200,60,0) 70%);clip-path:polygon(50% 0,60% 38%,100% 50%,60% 62%,50% 100%,40% 62%,0 50%,40% 38%);animation:hspin 1.6s linear infinite;filter:drop-shadow(0 0 .6cqw #ffd84a)}
@keyframes hspin{to{transform:rotate(360deg)}}
#up .st{display:inline-block;margin-top:1.8cqw;padding:.25cqw 1.8cqw .4cqw;border-radius:99px;background:rgba(255,255,255,.88);border:.25cqw solid #3a5df0;color:#1d3fd0;font-size:1.75cqw;font-weight:800}
/* maintenance */
#mt .rt{position:absolute;left:50%;bottom:1.2cqw;transform:translateX(-50%);padding:.3cqw 2.4cqw .45cqw;border-radius:99px;border:.3cqw solid #fff;background:linear-gradient(#5aa8ff,#2f55e8);color:#fff;font:inherit;font-weight:800;font-size:2cqw;text-shadow:0 .12cqw 0 #1a2a9a;box-shadow:0 .4cqw .8cqw rgba(0,10,80,.5);cursor:pointer;z-index:3;transition:transform .18s cubic-bezier(.3,1.7,.5,1)}
@media (hover:hover){#mt .rt:hover{transform:translateX(-50%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){#hm .art,#hm .logo,#hgo .coin,#hgo .halo,#hgo .ring,.hs .sp,#hm .tbn button.nw::before,#up .fil::before,#up .knob{animation:none!important}#hm .tbn button{transform:none;animation:none}}

/* ===== v110: on a phone the picture fills the whole screen (a little is cut at the top and bottom); the buttons move in so they are never cut ===== */
body.phone .hs .bgb{display:none}
body.phone .hs .stg{width:max(100vw,calc(200*var(--v1)));--cr:max(0px,calc((50cqw - 100*var(--v1))/2));--cx:max(0px,calc((100cqw - 100vw)/2))}
body.phone #hm .logo{top:calc(1.2cqw + var(--cr));left:calc(2cqw + var(--cx))}
body.phone #hm .tbn{top:calc(1.7cqw + var(--cr));right:calc(2cqw + var(--cx))}
body.phone #hgo{bottom:calc(3.4cqw + var(--cr))}
body.phone #hm .ver{bottom:calc(1.2cqw + var(--cr));left:calc(2cqw + var(--cx))}

const LOG=[["v123","הגשר ביער תוקן: הדמות הולכת על משטח הגשר עצמו, עולה ויורדת עם קשת הגשר, ורק הקיר הקדמי והעמודים מסתירים טיפה מהרגליים שלה (לפני כן כל הגשר הסתיר אותה והיא נראתה עומדת מאחוריו).","לחיצה בכל מקום על הגשר (על הקשת, על העמודים או על המשטח) מעלה את הדמות אליו."],["v122","עוד תיקונים ביער: הנהר זורם חלק בלי פיקסלים ובלי לחזור לעצמו, כתמי השמש על השביל חדים, זזים לאט ונושמים בלי להתעוות, כל האבנים והפטריות (גם הטחב שעליהן ואבני השביל) קבועות במקומן, ובגשר הדמות הולכת מעל הגשר והקיר מסתיר רק את הרגליים שלה.","תוקן העדכון האוטומטי: הוא מסתיים עכשיו בהצלחה ולא מופיע מחדש בכל כניסה למשחק."],["v121","תיקוני היער: הרצפה כבר לא מתעוותת (רק האור והצל זזים), האבנים נשארות במקומן, המפל והזרם זורמים חלק יותר, ובגשר הדמות נשארת תמיד מעליו והקיר מסתיר רק קצת ממנה."],["v120","היער חי! המים במפל ובנחל זורמים, העלים של העצים והפרחים מתנועעים ברוח, העננים נעים, הצל על השביל זז והאור נושם, ועלים נושרים לאט. בגשר הדמות הולכת עכשיו מעליו, והקיר שלו מסתיר רק קצת ממנה (את הרגליים)."],["v119","יש יער חדש! מגיעים אליו דרך המדרגות שבפינה של העיר (בצד ימין למטה), ומופיעים על המדרגות שלו. אפשר ללכת על השביל, לחצות את הגשר הקטן מעל הנחל (קיר הגשר מסתיר חלק מהדמות) ולחזור לעיר במדרגות. יש מוזיקה חדשה ליער ומסך טעינה משלו."],["v118","תפריטי תנוחות ישיבה חדשים לכל דמות, ולוח הגדרות חדש לכל יסוד עם מחוונים (ועם כפתורי פלוס ומינוס לשינוי קטן), כפתורי הפעל/כבוי ופעיל/כבוי. F11 מגדיל את האתר, ומסך מלא מההגדרות ממלא את המסך במשחק. העכבר הקלאסי מופיע גם בצדדי דף המשחק, וסינון הצאט מכיר עוד מילים לא ראויות שנכתבות באותיות באנגלית"],["v117","הודעה שעדיין מוצגת לא נעלמת כשמתחילים לכתוב הודעה חדשה, ושלוש הנקודות מופיעות רק כשכותבים ואין הודעה מעל הראש. וכשחבר מעצב את הבית בזמן שאתם מבקרים אצלו, העיצוב החדש מתעדכן לבד"],["v116","תיקון: חבר שיושב על ספה, כיסא או שרפרף בבית שלך עכשיו נראה (קודם הוא צויר מאחורי הרהיט ונעלם)"],["v115","אפשר לבקר בבית של חבר! כשחברים מחוברים עם אותו קוד, מופיע כפתור \"בתים של חברים\" - בוחרים חבר ונכנסים לבית שלו, ורואים את הרהיטים שלו. אפשר לדבר ולהסתובב יחד בבית (בבית של חבר אי אפשר לשנות רהיטים)"],["v114","מצב חברים ברור יותר: התווית גדולה יותר, מופיעה הודעה אם הקוד קצר מדי (צריך 4 תווים לפחות), ומוצג אם החברים נמצאים באזור אחר מהשחקן"],["v113","תיקון מצב חברים: עכשיו השחקן מתחבר לכל השרתים יחד, כך ששני חברים עם אותו קוד תמיד נפגשים (גם אם כל אחד התחבר דרך שרת אחר). בנוסף מופיע ליד הקוד אם החיבור פעיל"],["v112","שיפור ביצועים בטלפונים: מסך הכניסה קל יותר לציור (בלי שכבת רקע מטושטשת מיותרת ועם פחות נצנוצים)"],["v111","תיקוני תקלות ושיפור ביצועים: בדיקת העדכון החדשה קלה בהרבה ולא מורידה את כל הדף בכל פעם, וחוסכת אינטרנט בטלפון"],["v110","בטלפונים המשחק תמיד במסך מלא וממלא את כל המסך, בלי רקע מאחורה (חיתוך קל בקצוות)","במחשב כפתור ההתנתקות נשאר גם כשהמסך מלא"],["v109","כפתור הכניסה למשחק מתרחב כשהעכבר מעליו ומתכווץ כשלוחצים עליו"],["v108","עכבר חדש לכל האתר מחוץ למשחק: מסך הכניסה, חלונות המידע ומסכי העדכון, עם עכבר רגיל ועכבר לחיצה על כפתורים"],["v107","בטלפון משחקים רק לרוחב: בלי כפתור 'לשחק בכל זאת', ובאפליקציית האנדרואיד המסך ננעל על הצד"],["v106","אפשר להתקין את המשחק כאפליקציה דרך הדפדפן: כפתור התקן עכשיו בטלפון ובמחשב, והסבר להוספה למסך הבית באייפון","אפליקציה לאנדרואיד (קובץ APK) שאפשר להוריד מכפתור ההתקנה","כתובת קבועה באינטרנט למשחק, והוא מתעדכן בה לבד"],["v105","כל גרסה מוצגת עכשיו בנפרד בדף העדכונים, עם הסבר קצר על מה נכנס אליה","חלון ההתקנה ב-Windows בעברית עם כפתורים התקן וביטול, בלי שורת פקודה פתוחה"],["v104","כל ההיסטוריה של המשחק נכתבה בדף העדכונים הזה"],["v103","הכפתורים שבראש מסך הכניסה כבר לא קופצים גבוה כשהעכבר עליהם, אלא מתרוממים מעט"],["v102","כפתור התנתקות במסכי בחירת היסוד ובחירת הדמות, שמחזיר למסך הכניסה","באפליקציה שבמחשב: הודעה כשיוצאת גרסה חדשה, עם כפתור שפותח אותה"],["v101","מד ההתקדמות של העדכון מתקדם לפי הזמן ולא נתקע, והעדכון לא מחכה לאנימציה"],["v100","תיקון העדכון האוטומטי: מסך העדכון עם המד 1-100% עולה עכשיו כשנכנסים לגרסה חדשה"],["v99","מסך כניסה חדש עם כפתורים בראש המסך: עדכונים, חנות, עזרו לי, מידע להורים והתקנה","כפתור כניסה למשחק, מסך עדכון אוטומטי עם מד 1-100% ומסך תחזוקה","מצב חברים גם
